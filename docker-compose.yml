# Airflow 3 en LocalExecutor + PostgreSQL. Usage local uniquement (pas d'authentification).
# Démarrage : docker compose up -d --build   →   http://localhost:18080

x-airflow: &airflow
  build: .
  image: reseau-electrique-airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-secret-local-a-changer}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    DATA_DIR: /opt/airflow/data
    PYTHONPATH: /opt/airflow/src
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_DISABLE_AGENT_HINT: "1"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-18080}:8080"

  airflow-scheduler:
    <<: *airflow
    command: scheduler

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

  # Suivi des entraînements et registre des modèles. Les artefacts passent par le serveur (--serve-artifacts) :
  # aucun client n'a besoin de connaître le chemin du disque, qu'il tourne sous Windows ou dans un conteneur.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "mlflow:5000,localhost:15000,127.0.0.1:15000"
    volumes:
      - ./data/mlflow:/mlflow
    ports:
      - "127.0.0.1:15000:5000"
    restart: unless-stopped

  # API de prévision J+1 et meilleur créneau bas carbone : http://localhost:18000/docs
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: reseau-electrique-api
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  postgres:
