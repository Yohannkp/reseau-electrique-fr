models:
  - name: stg_eco2mix
    description: Consommation et production d'électricité par région et par quart d'heure (MW), dédoublonnées et typées.
    data_tests:
      - unique:
          arguments:
            column_name: "code_insee_region || '|' || cast(date_heure as varchar)"
    columns:
      - name: code_insee_region
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: date_heure
        description: Début du quart d'heure, en UTC.
        data_tests: [not_null]
      - name: consommation_mw
        data_tests: [not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [consolide, temps_reel]
